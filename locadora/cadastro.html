<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Blockbuster</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="logo">Blockbuster</div>
            <h2>Criar Nova Conta</h2>


            <form id="form-cadastro">
                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Como quer ser chamado?">
                </div>


                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>


                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" required placeholder="Crie uma senha">
                </div>


                <div class="campo">
                    <label for="senha">Confirmar Senha:</label>
                    <input type="password" id="senha" name="confirmar_senha" required placeholder="Confirme sua senha">
                </div>


                <button type="submit">Cadastrar</button>
            </form>



            <p id="mensagem" class="mensagem"></p>

            <p class="link-alternativo">
                Já possui cadastro? <a href="login.html">Faça login</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>


</html>
