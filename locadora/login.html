<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Blockbuster Login</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div class="auth-wrapper">
        <div class="auth-container">
            <div class="logo">Blockbuster</div>
            <h2>Entrar na Locadora</h2>

            <form id="form-login">
                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com" autocomplete="off">
                </div>


            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required placeholder="Sua senha" autocomplete="off">
            </div>


                <button type="submit">Entrar</button>
            </form>
        
            <p id="mensagem" class="mensagem"></p>

            <p class="link-alternativo">
                Ainda não tem conta? <a href="cadastro.html">Cadastre-se aqui</a>
            </p>
        </div>
    </div>
    <script src="auth.js"></script>
</body>

</html>
